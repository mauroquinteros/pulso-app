<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    ::-webkit-scrollbar{width:0;height:0;}
    a{color:#4FE9D6;} a:hover{color:#00E5CC;}
    @keyframes pulsoSpin{to{transform:rotate(360deg);}}
    @keyframes pulsoIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @media (prefers-reduced-motion: reduce){ .anim-in{animation:none !important;} }
  </style>
</helmet>
<div style="min-height:100vh;width:100%;background:#070A1C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:48px;font-family:'Manrope',system-ui,sans-serif;">

  <!-- Prototype state switcher (fuera del teléfono) -->
  <div style="display:flex;gap:8px;">
    <sc-for list="{{ statePills }}" as="p" hint-placeholder-count="4">
      <div onClick="{{ p.pick }}" style="padding:7px 14px;border-radius:9999px;border:1px solid {{ p.border }};background:{{ p.bg }};color:{{ p.color }};font-size:12px;font-weight:700;cursor:pointer;">{{ p.label }}</div>
    </sc-for>
  </div>

  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="402px,874px">
    <div style="min-height:874px;background:#0A0E27;padding:56px 24px 40px;display:flex;flex-direction:column;font-family:'Manrope',system-ui,sans-serif;">

      <!-- fixed top offset: button center lands ~43% of screen height -->
      <div style="height:84px;flex:none;"></div>

      <!-- brand block: 64pt disc, no glow · title 36/700 · support 14/400 lh20 -->
      <div class="anim-in" style="display:flex;flex-direction:column;align-items:center;animation:pulsoIn 250ms ease-out both;">
        <div style="width:64px;height:64px;border-radius:9999px;background:linear-gradient(135deg,#00E5CC,#1C9C8F);display:flex;align-items:center;justify-content:center;">
          <svg width="40" height="40" viewBox="0 0 100 100" role="img" aria-label="Pulso" style="display:block;">
            <path d="M10 50 H30 L41 26 L55 70 L63 50 H90" fill="none" stroke="#04211E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <div style="font-size:36px;font-weight:700;color:#FFFFFF;letter-spacing:-0.5px;margin-top:40px;text-align:center;">Entra a Pulso</div>
        <div style="font-size:14px;font-weight:400;color:#8E8E93;text-align:center;line-height:20px;margin-top:12px;max-width:280px;text-wrap:pretty;">Tu portafolio de inversión, claro y al día.</div>
      </div>

      <div style="height:40px;flex:none;"></div>

      <!-- the Google button -->
      <div onClick="{{ tapSignIn }}" role="button" aria-label="Continuar con Google" aria-disabled="{{ signingIn }}"
           style="height:56px;border-radius:9999px;background:#1C224D;display:flex;align-items:center;justify-content:center;gap:12px;cursor:{{ btnCursor }};opacity:{{ btnOpacity }};transition:transform 100ms ease-out,opacity 150ms ease-out;user-select:none;"
           style-active="transform:scale({{ btnPressScale }});">
        <sc-if value="{{ signingIn }}" hint-placeholder-val="{{ false }}">
          <span style="width:20px;height:20px;border-radius:9999px;border:2.5px solid #5A6080;border-top-color:#FFFFFF;animation:pulsoSpin 700ms linear infinite;display:inline-block;flex:none;"></span>
          <span style="font-size:16px;font-weight:700;color:#FFFFFF;">Conectando…</span>
        </sc-if>
        <sc-if value="{{ notSigningIn }}" hint-placeholder-val="{{ true }}">
          <svg width="20" height="20" viewBox="0 0 48 48" style="flex:none;">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
          </svg>
          <span style="font-size:16px;font-weight:700;color:#FFFFFF;">Continuar con Google</span>
        </sc-if>
      </div>

      <!-- error slot below the button: reserved 36pt, never moves the button -->
      <div style="height:36px;flex:none;margin-top:16px;display:flex;align-items:flex-start;justify-content:center;">
        <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
          <div role="alert" style="font-size:13px;font-weight:600;color:#FF5252;text-align:center;line-height:1.4;">{{ errorText }}</div>
        </sc-if>
      </div>

      <!-- bottom half deliberately empty -->
      <div style="flex:1;"></div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;980px&quot;,&quot;height&quot;:&quot;1040px&quot;},&quot;estadoInicial&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;signing&quot;,&quot;failed-offline&quot;,&quot;failed-generic&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;resultadoDemo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;failed-offline&quot;,&quot;failed-generic&quot;,&quot;idle&quot;],&quot;default&quot;:&quot;failed-offline&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;}}">
class Component extends DCLogic {
  // states: 'idle' | 'signing' | 'failed-offline' | 'failed-generic'
  state = { s: this.props.estadoInicial ?? 'idle' };
  timer = null;

  componentWillUnmount(){ clearTimeout(this.timer); }

  go(s){ clearTimeout(this.timer); this.setState({ s }); }

  ERRORS = {
    'failed-offline': 'Sin conexión. Revisa tu internet y vuelve a intentar.',
    'failed-generic': 'No pudimos iniciar sesión. Vuelve a intentar.',
  };

  renderVals(){
    const s = this.state.s;
    const signing = s === 'signing';
    const pills = [
      { key:'idle', label:'Idle' },
      { key:'signing', label:'Signing in' },
      { key:'failed-offline', label:'Failed · sin conexión' },
      { key:'failed-generic', label:'Failed · genérico' },
    ].map(p => {
      const on = p.key === s;
      return {
        label: p.label,
        pick: () => this.go(p.key),
        bg: on ? 'rgba(0,229,204,0.14)' : '#111638',
        border: on ? '#00E5CC' : '#1C224D',
        color: on ? '#4FE9D6' : '#8E8E93',
      };
    });
    return {
      statePills: pills,
      signingIn: signing,
      notSigningIn: !signing,
      hasError: s === 'failed-offline' || s === 'failed-generic',
      errorText: this.ERRORS[s] || '',
      btnOpacity: signing ? 0.6 : 1,
      btnCursor: signing ? 'default' : 'pointer',
      btnPressScale: signing ? 1 : 0.97,
      tapSignIn: () => {
        if (this.state.s === 'signing') return;
        this.go('signing');
        // demo: la hoja nativa de Google cubriría la pantalla aquí
        const next = (this.props.resultadoDemo ?? 'failed-offline');
        this.timer = setTimeout(() => this.go(next === 'idle' ? 'idle' : next), 1600);
      },
    };
  }
}
</script>
</body>
</html>
