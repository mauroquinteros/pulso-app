<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    ::-webkit-scrollbar{width:0;height:0;}
    .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
    a{color:#4FE9D6;}
    a:hover{color:#7BF0E1;}
    @keyframes bannerIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes alertIn{from{opacity:0;transform:scale(1.08);}to{opacity:1;transform:scale(1);}}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</helmet>
<div style="min-height:100vh;width:100%;background:#070A1C;display:flex;align-items:center;justify-content:center;padding:48px;font-family:'Manrope',system-ui,sans-serif;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="402px,874px">
    <div style="min-height:874px;background:#0A0E27;padding:56px 0 0;display:flex;flex-direction:column;position:relative;overflow:hidden;">

      <!-- HEADER -->
      <div style="display:flex;align-items:center;gap:12px;padding:14px 20px 20px;">
        <div style="width:34px;height:34px;border-radius:9999px;background:#111638;border:1px solid #1C224D;display:flex;align-items:center;justify-content:center;color:#00E5CC;font-size:20px;cursor:pointer;line-height:1;">‹</div>
        <span style="flex:1;font-size:21px;font-weight:800;color:#fff;letter-spacing:-0.3px;">Detalle</span>
        <sc-if value="{{ isHeaderVariant }}" hint-placeholder-val="{{ false }}">
          <div onClick="{{ onAskDelete }}" role="button" aria-label="Eliminar movimiento" style="width:44px;height:44px;margin-right:-10px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#FF5252;cursor:pointer;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9.5 7V4.9a.9.9 0 0 1 .9-.9h3.2a.9.9 0 0 1 .9.9V7"></path><path d="M6.6 7l.85 12.15a1 1 0 0 0 1 .85h7.1a1 1 0 0 0 1-.85L17.4 7"></path><path d="M10.4 11v6M13.6 11v6"></path></svg>
          </div>
        </sc-if>
      </div>

      <div style="flex:1;padding:8px 24px 40px;display:flex;flex-direction:column;opacity:{{ receiptOpacity }};transition:opacity .2s ease-out;">

        <!-- IDENTITY -->
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:36px;">
          <div style="width:52px;height:52px;border-radius:15px;background:{{ badgeBg }};display:flex;align-items:center;justify-content:center;color:{{ badgeColor }};flex:none;">
            <sc-if value="{{ isBuy }}" hint-placeholder-val="{{ true }}">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 12.2a1 1 0 0 0 1 .8h8.4a1 1 0 0 0 1-.8L20 8H6"></path><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"></circle></svg>
            </sc-if>
            <sc-if value="{{ isSell }}" hint-placeholder-val="{{ false }}">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 3h6a1 1 0 0 1 1 1v6a1 1 0 0 1-.3.7l-8 8a1 1 0 0 1-1.4 0l-6-6a1 1 0 0 1 0-1.4l8-8a1 1 0 0 1 .7-.3z"></path><circle cx="15.5" cy="7.5" r="1.4" fill="currentColor" stroke="none"></circle></svg>
            </sc-if>
            <sc-if value="{{ isDividend }}" hint-placeholder-val="{{ false }}">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="2.5"></rect><circle cx="12" cy="12" r="3"></circle></svg>
            </sc-if>
            <sc-if value="{{ isDeposit }}" hint-placeholder-val="{{ false }}">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
            </sc-if>
            <sc-if value="{{ isWithdrawal }}" hint-placeholder-val="{{ false }}">
              <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8"></path></svg>
            </sc-if>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.4px;">{{ headerTitle }}</div>
            <div style="font-size:14px;color:#8E8E93;margin-top:3px;">{{ headerDate }}</div>
          </div>
        </div>

        <!-- RECEIPT -->
        <div style="flex:1;display:flex;flex-direction:column;">

          <sc-if value="{{ hasFacts }}" hint-placeholder-val="{{ true }}">
            <sc-for list="{{ facts }}" as="line" hint-placeholder-count="2">
              <div style="display:flex;align-items:baseline;justify-content:space-between;padding:20px 0;border-top:{{ line.borderTop }};">
                <span style="font-size:16px;color:#8E8E93;font-weight:500;">{{ line.label }}</span>
                <span class="mono" style="font-size:18px;font-weight:700;color:#E8EAF2;">{{ line.amount }}</span>
              </div>
            </sc-for>
          </sc-if>

          <sc-for list="{{ money }}" as="line" hint-placeholder-count="2">
            <div style="display:flex;align-items:baseline;justify-content:space-between;padding:20px 0;border-top:{{ line.borderTop }};">
              <span style="font-size:16px;color:#8E8E93;font-weight:500;">{{ line.label }}</span>
              <span class="mono" style="font-size:18px;font-weight:700;color:#E8EAF2;">{{ line.amount }}</span>
            </div>
          </sc-for>

          <!-- TOTAL (stays anchored; the destructive control sits below it) -->
          <div style="display:flex;align-items:baseline;justify-content:space-between;padding:24px 0 20px;border-top:1px solid #1C224D;margin-top:auto;">
            <span style="font-size:17px;color:#fff;font-weight:700;">{{ total.label }}</span>
            <span class="mono" style="font-size:21px;font-weight:800;color:#fff;">{{ total.amount }}</span>
          </div>

          <sc-if value="{{ isFooterVariant }}" hint-placeholder-val="{{ true }}">
          <div style="margin-top:12px;padding-top:24px;border-top:1px solid #12173A;">
            <div onClick="{{ onAskDelete }}" role="button" aria-label="Eliminar movimiento" aria-disabled="{{ isBusy }}" style="height:52px;border-radius:14px;background:rgba(255,82,82,0.10);border:1px solid rgba(255,82,82,0.34);display:flex;align-items:center;justify-content:center;gap:9px;color:#FF5252;cursor:pointer;opacity:{{ buttonOpacity }};transition:opacity .18s ease-out;">
              <sc-if value="{{ isBusy }}" hint-placeholder-val="{{ false }}">
                <div role="status" aria-label="Eliminando movimiento" style="width:18px;height:18px;border-radius:9999px;border:2px solid rgba(255,82,82,0.25);border-top-color:#FF5252;animation:spin .7s linear infinite;"></div>
              </sc-if>
              <sc-if value="{{ showTrashIcon }}" hint-placeholder-val="{{ true }}">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9.5 7V4.9a.9.9 0 0 1 .9-.9h3.2a.9.9 0 0 1 .9.9V7"></path><path d="M6.6 7l.85 12.15a1 1 0 0 0 1 .85h7.1a1 1 0 0 0 1-.85L17.4 7"></path><path d="M10.4 11v6M13.6 11v6"></path></svg>
              </sc-if>
              <span style="font-size:16px;font-weight:700;">{{ buttonLabel }}</span>
            </div>
          </div>
          </sc-if>

        </div>

      </div>

      <!-- ERROR BANNER -->
      <sc-if value="{{ showBanner }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:16px;right:16px;top:60px;background:rgba(255,82,82,0.14);border:1px solid rgba(255,82,82,0.42);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;animation:bannerIn .22s ease-out;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF5252" stroke-width="1.8" stroke-linecap="round" style="flex:none;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v6M12 16.5h.01"></path></svg>
        <span style="font-size:13px;font-weight:700;color:#FF8A8A;">No se pudo eliminar. Intenta de nuevo.</span>
      </div>
      </sc-if>

      <!-- NATIVE iOS ALERT -->
      <sc-if value="{{ showAlert }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:rgba(0,0,0,0.42);display:flex;align-items:center;justify-content:center;">
        <div role="alertdialog" style="width:270px;border-radius:14px;background:rgba(40,40,44,0.94);backdrop-filter:blur(20px);overflow:hidden;animation:alertIn .18s ease-out;">
          <div style="padding:19px 16px 15px;text-align:center;">
            <div style="font-size:17px;font-weight:600;color:#fff;letter-spacing:-0.2px;">¿Eliminar este movimiento?</div>
            <sc-if value="{{ alertHasBody }}" hint-placeholder-val="{{ true }}">
              <div style="font-size:13px;font-weight:400;color:#fff;margin-top:5px;line-height:1.35;">{{ alertBody }}</div>
            </sc-if>
          </div>
          <div style="display:flex;border-top:0.5px solid rgba(84,84,88,0.65);">
            <div onClick="{{ onCancelDelete }}" role="button" style="flex:1;height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#0A84FF;cursor:pointer;border-right:0.5px solid rgba(84,84,88,0.65);">Cancelar</div>
            <div onClick="{{ onConfirmDelete }}" role="button" style="flex:1;height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:400;color:#FF453A;cursor:pointer;">Eliminar</div>
          </div>
        </div>
      </div>
      </sc-if>

      <!-- RETURN TO LIST -->
      <sc-if value="{{ isGone }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;background:#0A0E27;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:14px;font-weight:600;color:#8E8E93;">Volviendo a Movimientos</span>
      </div>
      </sc-if>

    </div>
  </x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:940},&quot;variante&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Boton bajo el total&quot;,&quot;options&quot;:[&quot;Boton bajo el total&quot;,&quot;Icono en el header&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variante&quot;},&quot;demoState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Reposo&quot;,&quot;options&quot;:[&quot;Reposo&quot;,&quot;Confirmando&quot;,&quot;Eliminando&quot;,&quot;Error al eliminar&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;demoType&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Compra&quot;,&quot;options&quot;:[&quot;Compra&quot;,&quot;Venta&quot;,&quot;Dividendo&quot;,&quot;Depósito&quot;,&quot;Retiro&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;alertVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Con cuerpo&quot;,&quot;options&quot;:[&quot;Con cuerpo&quot;,&quot;Solo titulo&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Confirmación&quot;}}">
class Component extends DCLogic {
  state = { phase:'idle' }; // idle | confirm | deleting | error | gone

  MONTHS_ES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  TYPE_META = {
    buy:        { label:'Compra',    bg:'rgba(120,160,255,0.16)', color:'#9DB8FF' },
    sell:       { label:'Venta',     bg:'rgba(255,140,140,0.14)', color:'#FF9D9D' },
    dividend:   { label:'Dividendo', bg:'rgba(0,229,204,0.12)',   color:'#4FE9D6' },
    deposit:    { label:'Depósito',  bg:'rgba(0,200,83,0.16)',    color:'#7DE8AA' },
    withdrawal: { label:'Retiro',    bg:'rgba(142,142,147,0.14)', color:'#B8BCCB' },
  };

  MOCK = {
    buy:        { type:'buy',        ticker:'AAPL', date:'2025-01-15', shares:2.45321, price:182.50, gross:447.71, fee:0.15, total:447.86 },
    sell:       { type:'sell',       ticker:'AAPL', date:'2025-09-22', shares:3,       price:195.50, gross:586.50, fee:0.15, regFee:0.03, total:586.32 },
    dividend:   { type:'dividend',   ticker:'AAPL', date:'2025-11-15', gross:18.50, tax:5.55, total:12.95 },
    deposit:    { type:'deposit',    date:'2025-01-10', cash:3000.00, fee:3.99, total:3003.99 },
    withdrawal: { type:'withdrawal', date:'2026-01-08', cash:500.00, fee:1.00, total:499.00 },
  };

  componentDidMount(){ this._applyDemo(this.props.demoState); }
  componentDidUpdate(prev){ if (prev.demoState !== this.props.demoState) this._applyDemo(this.props.demoState); }
  componentWillUnmount(){ clearTimeout(this._t1); clearTimeout(this._t2); }

  _applyDemo(demoState){
    clearTimeout(this._t1); clearTimeout(this._t2);
    const phase = { 'Reposo':'idle', 'Confirmando':'confirm', 'Eliminando':'deleting', 'Error al eliminar':'error' }[demoState] || 'idle';
    this.setState({ phase });
  }

  usd(n){ return '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  signed(n, sign){ return (sign === '-' ? '\u2212' : '+') + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  shares(n){ return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:5}); }
  dateLabel(iso){ const [y,m,d] = iso.split('-').map(Number); return d + ' ' + this.MONTHS_ES[m-1] + ' ' + y; }

  askDelete(){ if (this.state.phase === 'idle' || this.state.phase === 'error') this.setState({ phase:'confirm' }); }
  cancelDelete(){ this.setState({ phase:'idle' }); }
  confirmDelete(){
    this.setState({ phase:'deleting' });
    this._t1 = setTimeout(() => {
      this.setState({ phase:'gone' });
      this._t2 = setTimeout(() => this.setState({ phase:'idle' }), 1100);
    }, 1400);
  }

  buildView(m){
    const meta = this.TYPE_META[m.type];
    const hasTicker = m.type === 'buy' || m.type === 'sell' || m.type === 'dividend';
    const header = { title: hasTicker ? (meta.label + ' ' + m.ticker) : meta.label, dateLabel: this.dateLabel(m.date), type: m.type };
    let facts = [], money = [], total;

    if (m.type === 'buy') {
      facts = [{ label:'Acciones', amount:this.shares(m.shares) }, { label:'Precio de ejecución', amount:this.usd(m.price) }];
      money = [{ label:'Monto bruto', amount:this.usd(m.gross) }, { label:'Comisión', amount:this.signed(m.fee,'+') }];
      total = { label:'Total pagado', amount:this.usd(m.total) };
    } else if (m.type === 'sell') {
      facts = [{ label:'Acciones', amount:this.shares(m.shares) }, { label:'Precio de ejecución', amount:this.usd(m.price) }];
      money = [{ label:'Monto bruto', amount:this.usd(m.gross) }, { label:'Comisión', amount:this.signed(m.fee,'-') }, { label:'Tarifas regulatorias', amount:this.signed(m.regFee,'-') }];
      total = { label:'Total recibido', amount:this.usd(m.total) };
    } else if (m.type === 'dividend') {
      money = [{ label:'Monto bruto', amount:this.usd(m.gross) }, { label:'Impuesto', amount:this.signed(m.tax,'-') }];
      total = { label:'Total recibido', amount:this.usd(m.total) };
    } else if (m.type === 'deposit') {
      money = [{ label:'Efectivo agregado', amount:this.usd(m.cash) }, { label:'Comisión de transferencia', amount:this.signed(m.fee,'+') }];
      total = { label:'Total transferido', amount:this.usd(m.total) };
    } else {
      money = [{ label:'Efectivo retirado', amount:this.usd(m.cash) }, { label:'Comisión', amount:this.signed(m.fee,'-') }];
      total = { label:'Recibido en banco', amount:this.usd(m.total) };
    }

    facts = facts.map((l,i) => ({ ...l, borderTop: i === 0 ? 'none' : '1px solid #1C224D' }));
    money = money.map((l,i) => ({ ...l, borderTop: (i === 0 && facts.length === 0) ? 'none' : '1px solid #1C224D' }));
    return { header, facts, money, total };
  }

  movementLine(m, view){
    return view.header.title + ' - ' + this.dateLabel(m.date) + ' - ' + this.usd(m.total);
  }

  renderVals(){
    const demoType = this.props.demoType ?? 'Compra';
    const variante = this.props.variante ?? 'Boton bajo el total';
    const alertVariant = this.props.alertVariant ?? 'Con cuerpo';
    const key = { 'Compra':'buy', 'Venta':'sell', 'Dividendo':'dividend', 'Depósito':'deposit', 'Retiro':'withdrawal' }[demoType] || 'buy';
    const m = this.MOCK[key];
    const view = this.buildView(m);
    const phase = this.state.phase;
    const busy = phase === 'deleting';

    return {
      headerTitle: view.header.title,
      headerDate: view.header.dateLabel,
      badgeBg: this.TYPE_META[view.header.type].bg,
      badgeColor: this.TYPE_META[view.header.type].color,
      isBuy: view.header.type === 'buy',
      isSell: view.header.type === 'sell',
      isDividend: view.header.type === 'dividend',
      isDeposit: view.header.type === 'deposit',
      isWithdrawal: view.header.type === 'withdrawal',
      hasFacts: view.facts.length > 0,
      facts: view.facts,
      money: view.money,
      total: view.total,

      isHeaderVariant: variante === 'Icono en el header',
      isFooterVariant: variante === 'Boton bajo el total',
      isBusy: busy,
      showTrashIcon: !busy,
      buttonLabel: busy ? 'Eliminando...' : 'Eliminar movimiento',
      buttonOpacity: busy ? 0.55 : 1,
      receiptOpacity: busy ? 0.55 : 1,

      showAlert: phase === 'confirm',
      alertHasBody: alertVariant === 'Con cuerpo',
      alertBody: this.movementLine(m, view),
      showBanner: phase === 'error',
      isGone: phase === 'gone',

      onAskDelete: () => this.askDelete(),
      onCancelDelete: () => this.cancelDelete(),
      onConfirmDelete: () => this.confirmDelete(),
    };
  }
}

</script>
</body>
</html>
